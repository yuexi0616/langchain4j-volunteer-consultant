services:
  mysql:
    image: mysql:8.4
    container_name: langchain4j-consultant-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:-langchain4j_demo}
      MYSQL_DATABASE: langchain4jstudy
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docs/sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci

  redis-stack:
    image: redis/redis-stack:latest
    container_name: langchain4j-consultant-redis
    ports:
      - "6379:6379"
      - "8001:8001"
    volumes:
      - redis-data:/data

volumes:
  mysql-data:
  redis-data:
